[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prs-methods"
version = "0.1.0"
description = "Инструменты для написания методов платформы Peresvet"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "patio>=0.1.4",
    "patio-rabbitmq>=0.1.1",
]

[project.optional-dependencies]
dev = ["pytest", "PyYAML"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
